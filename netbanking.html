<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Net Banking - Heritage Heaven</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><style>body{font-family:Montserrat;background:#fcf9f8}.serif{font-family:'Playfair Display',serif}.bank{transition:.25s}.bank:hover{transform:translateY(-3px);border-color:#735c00}.card{box-shadow:0 25px 70px #0001;animation:up .7s ease both}@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}</style></head><body><header class="border-b bg-white/80"><div class="max-w-6xl mx-auto px-5 py-5 flex justify-between"><a href="index.html" class="serif italic text-2xl text-[#002627]">Heritage Heaven</a><a href="payment.html">Back</a></div></header><main class="max-w-5xl mx-auto px-5 py-16"><div class="text-center mb-10"><p class="uppercase tracking-[.25em] text-[#735c00] text-sm">Secure Checkout</p><h1 class="serif text-5xl text-[#002627] mt-3">Net Banking</h1></div><section class="bg-white rounded-3xl p-8 card"><div class="grid md:grid-cols-[1fr_1.4fr] gap-10"><aside><h2 class="serif text-2xl">Royal Suite Summary</h2><img class="w-full h-56 object-cover rounded-2xl mt-5" src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1000&q=85"><p id="amount" class="font-semibold mt-4">₹14,999</p></aside><div><h2 class="serif text-2xl">Select Your Bank</h2><input id="search" placeholder="Search bank" class="w-full border-0 border-b py-4 outline-none focus:border-[#735c00]"><div id="banks" class="grid grid-cols-2 gap-3 mt-5"><button class="bank border rounded-xl p-4 text-left">State Bank of India</button><button class="bank border rounded-xl p-4 text-left">HDFC Bank</button><button class="bank border rounded-xl p-4 text-left">ICICI Bank</button><button class="bank border rounded-xl p-4 text-left">Axis Bank</button><button class="bank border rounded-xl p-4 text-left">Kotak Mahindra</button><button class="bank border rounded-xl p-4 text-left">Punjab National Bank</button></div><button onclick="pay()" class="w-full bg-[#735c00] text-white py-4 rounded-full mt-7 font-semibold">Continue Securely</button><p class="text-xs text-gray-400 mt-5">Demo interface only. Connect an authorized banking/payment provider for real transactions.</p><p id="done" class="hidden mt-5 text-[#002627] font-semibold">✓ Bank selected. Continue through your authorized payment provider.</p></div></div></section></main><script>document.querySelectorAll('.bank').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bank').forEach(x=>x.classList.remove('ring-2','ring-[#735c00]'));b.classList.add('ring-2','ring-[#735c00]')});document.getElementById('search').oninput=e=>document.querySelectorAll('.bank').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'block':'none');function pay(){document.getElementById('done').classList.remove('hidden')}</script></body></html>
