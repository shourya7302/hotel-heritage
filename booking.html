<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Your Stay - Heritage Heaven</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><style>body{font-family:Montserrat;background:#fcf9f8;color:#1b1b1c}.serif{font-family:'Playfair Display',serif}.field{border:0;border-bottom:1px solid #c0c8c8;background:transparent;padding:12px 0;width:100%;outline:none}.field:focus{border-color:#735c00}.card{box-shadow:0 25px 70px #0001;animation:up .7s ease both}@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}</style></head><body><header class="border-b bg-white/80 backdrop-blur"><div class="max-w-7xl mx-auto px-5 py-5 flex justify-between"><a href="index.html" class="serif italic text-2xl text-[#002627]">Heritage Heaven</a><a href="index.html" class="text-sm font-semibold">Back to Hotel</a></div></header><main class="max-w-6xl mx-auto px-5 py-16"><div class="text-center mb-12"><p class="uppercase tracking-[.25em] text-[#735c00] text-sm">Reservations</p><h1 class="serif text-5xl md:text-6xl text-[#002627] mt-4">Complete Your Reservation</h1><p class="text-gray-600 mt-4">Your booking will be securely recorded online.</p></div><div class="grid lg:grid-cols-[1.5fr_1fr] gap-10"><form id="bookingForm" class="bg-white rounded-3xl p-7 md:p-10 card space-y-8"><div><h2 class="serif text-2xl text-[#002627]">Guest Details</h2><div class="grid md:grid-cols-2 gap-6 mt-5"><input id="name" required class="field" placeholder="Full name"><input id="email" required type="email" class="field" placeholder="Email address"><input id="phone" required class="field" placeholder="Phone number"></div></div><div><h2 class="serif text-2xl text-[#002627]">Stay Details</h2><div class="grid md:grid-cols-2 gap-6 mt-5"><label class="text-xs uppercase tracking-widest">Check-in<input id="checkin" required type="date" class="field"></label><label class="text-xs uppercase tracking-widest">Check-out<input id="checkout" required type="date" class="field"></label><select id="room" class="field"><option value="0">Heritage Classic — ₹0/night</option><option value="0">Premium Mountain View — ₹0/night</option><option value="0">Deluxe Library Suite — ₹0/night</option><option value="0">Sovereign Royal Suite — ₹0/night</option></select><select id="guests" class="field"><option>1 Guest</option><option selected>2 Guests</option><option>3 Guests</option><option>4 Guests</option></select></div></div><button id="submitBtn" class="w-full bg-[#735c00] text-white py-4 rounded-full font-semibold hover:scale-[1.01] transition">Submit Booking</button><p id="msg" class="text-center text-sm"></p></form><aside class="bg-[#002627] text-white rounded-3xl p-8 h-fit"><p class="uppercase tracking-widest text-[#ffe088] text-xs">Booking Summary</p><h2 id="summaryRoom" class="serif text-3xl mt-3">Heritage Classic</h2><img class="w-full h-56 object-cover rounded-2xl mt-6" src="https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=1000&q=85"><div class="mt-6 space-y-3 text-white/80"><div class="flex justify-between"><span>Rate</span><b id="rate">₹0/night</b></div><div class="flex justify-between border-t border-white/10 pt-3"><span>Status</span><b>Pending approval</b></div></div></aside></div></main><script>const SUPABASE_URL='https://pynahvustgelsexcxfit.supabase.co';const SUPABASE_KEY='sb_publishable_-zfB7X37ers8lB6-hPOerA_pseQWbDi';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const room=document.getElementById('room'),rate=document.getElementById('rate');room.onchange=()=>{const n=room.options[room.selectedIndex].text;document.getElementById('summaryRoom').textContent=n.split(' — ')[0];rate.textContent='₹'+Number(room.value).toLocaleString('en-IN')+'/night'};document.getElementById('bookingForm').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('submitBtn'),msg=document.getElementById('msg');btn.disabled=true;btn.textContent='Submitting…';const b={booking_id:'HH-'+Date.now().toString().slice(-6),guest_name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim(),room:room.options[room.selectedIndex].text.split(' — ')[0],checkin:document.getElementById('checkin').value,checkout:document.getElementById('checkout').value,guests:document.getElementById('guests').value,amount:Number(room.value),payment_status:'pending',booking_status:'pending'};const {error}=await db.from('bookings').insert(b);if(error){msg.textContent='Could not submit booking. Please try again.';msg.className='text-center text-sm text-red-600';btn.disabled=false;btn.textContent='Submit Booking';return}localStorage.setItem('heritageHeavenBooking',JSON.stringify({...b,id:b.booking_id,created:new Date().toISOString()}));location.href='booking-confirmed.html?booking='+encodeURIComponent(b.booking_id)};</script></body></html>
