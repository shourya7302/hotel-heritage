name: Remove duplicate photo strip
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-duplicate-photo-strip.yml'
permissions:
  contents: write
jobs:
  remove-strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate photo strip
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<section class="py-20 sm:py-24 max-w-7xl mx-auto px-4 sm:px-5"><div class="grid md:grid-cols-2 gap-5 sm:gap-8">.*?</section><section id="gallery"'
          new, n = re.subn(pattern, '<section id="gallery"', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected 1 duplicate photo strip, found {n}')
          p.write_text(new, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove duplicate photo strip above gallery" || exit 0
          git push
