<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Heritage Heaven | Guest Ratings</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><style>body{font-family:Montserrat,sans-serif;background:#fcf9f8;color:#172021}.serif{font-family:'Playfair Display',serif}.star{font-size:2rem;cursor:pointer;transition:.2s}.star:hover,.star.active{transform:scale(1.15)}.card{box-shadow:0 20px 60px #0001}</style></head><body><header class="bg-[#002627] text-white"><div class="max-w-5xl mx-auto px-5 py-5 flex justify-between items-center"><a href="index.html" class="serif text-2xl italic">Heritage Heaven</a><a href="index.html" class="rounded-full border border-white/30 px-5 py-2">Back to Hotel</a></div></header><main class="max-w-5xl mx-auto px-5 py-16"><div class="text-center"><p class="uppercase tracking-[.25em] text-[#735c00] text-sm">Guest Experiences</p><h1 class="serif text-5xl md:text-6xl text-[#002627] mt-3">Our Guest Rating</h1><div class="mt-7"><span class="serif text-6xl">4.9</span><p class="text-amber-600 text-2xl mt-2">★★★★★</p><p class="text-gray-500">Based on guest feedback</p></div></div><div class="grid md:grid-cols-2 gap-8 mt-14"><section class="bg-white rounded-3xl p-8 card"><h2 class="serif text-3xl text-[#002627]">Share Your Experience</h2><p class="text-gray-500 mt-2">Tell future guests about your stay at Heritage Heaven.</p><form id="ratingForm" class="mt-7 space-y-5"><input id="name" required class="w-full border rounded-xl p-3" placeholder="Your name"><div><p class="text-sm text-gray-500 mb-2">Your rating</p><div id="stars" class="flex gap-2"><button type="button" class="star" data-value="1">☆</button><button type="button" class="star" data-value="2">☆</button><button type="button" class="star" data-value="3">☆</button><button type="button" class="star" data-value="4">☆</button><button type="button" class="star" data-value="5">☆</button></div></div><textarea id="review" required rows="5" class="w-full border rounded-xl p-3" placeholder="Write your review"></textarea><button class="w-full bg-[#735c00] text-white py-4 rounded-full font-semibold">Submit Rating</button><p id="msg" class="hidden text-green-700">Thank you for your rating!</p></form></section><section><h2 class="serif text-3xl text-[#002627] mb-5">Recent Guest Reviews</h2><div id="reviews" class="space-y-4"></div></section></div></main><script>let selected=0;const stars=[...document.querySelectorAll('.star')];stars.forEach(s=>s.onclick=()=>{selected=+s.dataset.value;stars.forEach(x=>x.textContent=+x.dataset.value<=selected?'★':'☆')});function reviews(){return JSON.parse(localStorage.getItem('heritageReviews')||'[]')}function render(){const r=reviews();document.getElementById('reviews').innerHTML=(r.length?r:[{name:'Heritage Heaven Guest',rating:5,text:'A beautiful stay with wonderful hospitality.'}]).map(x=>`<article class="bg-white rounded-2xl p-6 card"><div class="flex justify-between gap-4"><b>${x.name}</b><span class="text-amber-600">${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</span></div><p class="text-gray-600 mt-3">${x.text}</p></article>`).join('')}document.getElementById('ratingForm').onsubmit=e=>{e.preventDefault();if(!selected){alert('Please select a star rating.');return}const r=reviews();r.unshift({name:document.getElementById('name').value,rating:selected,text:document.getElementById('review').value});localStorage.setItem('heritageReviews',JSON.stringify(r));document.getElementById('msg').classList.remove('hidden');e.target.reset();selected=0;stars.forEach(x=>x.textContent='☆');render()};render();</script></body></html>
