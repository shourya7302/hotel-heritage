<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heritage Heaven | Admin Bookings</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet"><style>body{font-family:Montserrat;background:#f7f5ef}.serif{font-family:'Playfair Display',serif}.card{box-shadow:0 18px 50px #0001}button{transition:.2s}button:hover{transform:translateY(-1px)}</style></head><body><header class="bg-[#002627] text-white"><div class="max-w-7xl mx-auto px-5 py-5 flex justify-between"><a href="index.html" class="serif text-2xl italic">Heritage Heaven</a><span class="text-sm text-white/70">Admin Bookings</span></div></header><main class="max-w-7xl mx-auto px-5 py-10"><div class="mb-8"><p class="uppercase tracking-[.2em] text-[#735c00] text-xs">Central Database</p><h1 class="serif text-5xl text-[#002627] mt-2">All Bookings</h1><p class="text-gray-500 mt-2">Bookings made from any phone, tablet or computer appear here.</p></div><div class="grid md:grid-cols-3 gap-5 mb-7"><div class="bg-white rounded-3xl p-6 card"><p class="text-xs uppercase tracking-widest text-gray-500">Total</p><b id="total" class="serif text-4xl text-[#002627]">0</b></div><div class="bg-white rounded-3xl p-6 card"><p class="text-xs uppercase tracking-widest text-gray-500">Pending</p><b id="pending" class="serif text-4xl text-[#002627]">0</b></div><div class="bg-white rounded-3xl p-6 card"><p class="text-xs uppercase tracking-widest text-gray-500">Confirmed</p><b id="confirmed" class="serif text-4xl text-[#002627]">0</b></div></div><section class="bg-white rounded-3xl p-6 card overflow-x-auto"><table class="w-full min-w-[1150px] text-left"><thead class="border-b text-xs uppercase tracking-widest text-gray-500"><tr><th class="py-4">S.No.</th><th>Booking</th><th>Guest</th><th>Room</th><th>Stay</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><p id="message" class="text-center py-12 text-gray-500">Connecting to booking database…</p></section></main><script>const API='https://pynahvustgelsexcxfit.supabase.co/rest/v1/bookings';const KEY='sb_publishable_-zfB7X37ers8lB6-hPOerA_pseQWbDi';let bookings=[];const headers={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await fetch(API+'?select=*&order=created_at.asc',{headers});if(!r.ok)throw new Error('HTTP '+r.status+' — '+await r.text());bookings=await r.json();render()}catch(e){document.getElementById('message').innerHTML='<b class="text-red-700">Could not load bookings.</b><br><span class="text-sm">'+esc(e.message)+'</span>'}}async function approve(id){const b=bookings.find(x=>x.id==id);if(!b||!confirm('Approve this booking after receiving payment?'))return;try{const r=await fetch(API+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({payment_status:'paid',booking_status:'confirmed',approved_at:new Date().toISOString(),approved_by:'admin'})});if(!r.ok)throw new Error('HTTP '+r.status+' — '+await r.text());await load();alert('Booking approved successfully.')}catch(e){alert('Could not approve booking: '+e.message)}}function render(){const p=bookings.filter(b=>b.booking_status!=='confirmed').length,c=bookings.length-p;document.getElementById('total').textContent=bookings.length;document.getElementById('pending').textContent=p;document.getElementById('confirmed').textContent=c;const rows=document.getElementById('rows');document.getElementById('message').style.display=bookings.length?'none':'block';rows.innerHTML=bookings.map((b,i)=>`<tr class="border-b"><td class="py-5">${i+1}</td><td><b>${esc(b.booking_id)}</b></td><td><b>${esc(b.guest_name)}</b><div class="text-xs text-gray-500">${esc(b.email)}<br>${esc(b.phone)}</div></td><td>${esc(b.room)}</td><td>${esc(b.checkin)}<br>to ${esc(b.checkout)}<br>${esc(b.guests)}</td><td>₹${Number(b.amount||0).toLocaleString('en-IN')}</td><td>${b.booking_status==='confirmed'?'<span class="text-green-700 font-semibold">Confirmed</span>':'<span class="text-amber-700 font-semibold">Pending Payment</span>'}</td><td>${b.booking_status==='confirmed'?'<span class="text-green-700">✓ Approved</span>':`<button onclick="approve('${b.id}')" class="bg-[#735c00] text-white rounded-full px-5 py-2 text-sm font-semibold">Confirm Booking</button>`}</td></tr>`).join('')}load();setInterval(load,10000);</script></body></html>
