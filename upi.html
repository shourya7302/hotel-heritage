<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPI Payment - Heritage Heaven</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><style>body{font-family:Montserrat;background:#fcf9f8}.serif{font-family:'Playfair Display',serif}.card{box-shadow:0 25px 70px #0001;animation:up .7s ease both}@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}</style></head><body><header class="border-b bg-white/80"><div class="max-w-5xl mx-auto px-5 py-5 flex justify-between"><a href="index.html" class="serif italic text-2xl text-[#002627]">Heritage Heaven</a><a href="payment.html">Back</a></div></header><main class="max-w-2xl mx-auto px-5 py-16"><section class="bg-white rounded-3xl p-8 md:p-10 card"><p class="uppercase tracking-[.25em] text-[#735c00] text-sm">Secure UPI</p><h1 class="serif text-5xl text-[#002627] mt-3">UPI Payment</h1><p class="text-gray-500 mt-3">Enter your UPI ID to continue with the demo payment flow.</p><label class="block text-xs uppercase tracking-widest mt-9">UPI ID<input id="upi" required placeholder="yourname@bank" class="w-full border-0 border-b border-gray-300 py-4 outline-none focus:border-[#735c00]"></label><button onclick="pay()" class="w-full bg-[#735c00] text-white py-4 rounded-full mt-8 font-semibold">Pay <span id="amount">₹4,999</span></button><p class="text-xs text-gray-400 mt-6">This is a front-end demo. No real payment is processed.</p><div id="done" class="hidden mt-7 text-center text-[#002627]"><b>✓ Payment request submitted</b><p class="text-sm text-gray-500 mt-1">Return to the hotel homepage.</p></div></section></main><script>const b=JSON.parse(localStorage.getItem('heritageHeavenBooking')||'null');if(b){const m=b.room.match(/[\d,]+/);if(m)document.getElementById('amount').textContent='₹'+m[0]}function pay(){if(!document.getElementById('upi').value)return;document.getElementById('done').classList.remove('hidden')}</script></body></html>
